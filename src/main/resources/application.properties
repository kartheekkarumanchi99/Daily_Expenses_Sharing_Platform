spring.application.name=com.expensesharing


# MySQL Database Connection Configuration
# Credentials are read from environment variables so no secrets are committed.
# Defaults after the ':' are used only when the variable is not set.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/expensesharingdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI UI available at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# JWT settings (override the secret via SECURITY_JWT_SECRET in real environments).
# The secret must be at least 32 characters for HS256.
security.jwt.secret=${SECURITY_JWT_SECRET:change-this-dev-secret-please-32chars-min-0123456789}
security.jwt.expiration-ms=${SECURITY_JWT_EXPIRATION_MS:86400000}
